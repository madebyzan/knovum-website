packages:
  - apps/*

# Independent public-site workspace; never inherits the desktop application workspace.
engineStrict: true
strictPeerDependencies: false
saveExact: true
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.4.5"
  - "@astrojs/prism@4.1.1"
  - "@astrojs/telemetry@3.4.1"
  - astro@7.4.2
  - "@lobehub/icons-static-svg@1.97.0"
# astro-icon imports astro/types but does not declare Astro as a dependency.
packageExtensions:
  astro-icon@1.2.0:
    peerDependencies:
      astro: ^7.2.10
